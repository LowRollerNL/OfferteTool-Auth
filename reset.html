<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wachtwoord wijzigen - OfferteTool</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 350px;
            padding: 30px;
            background: #242424;
            border-radius: 12px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #bbb;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: #3b82f6;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        #message {
            margin-top: 15px;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>OfferteTool</h1>

    <h2>Wachtwoord wijzigen</h2>

    <p>Voer hieronder je nieuwe wachtwoord in.</p>

    <input
        type="password"
        id="password"
        placeholder="Nieuw wachtwoord"
    >

    <input
        type="password"
        id="password2"
        placeholder="Nieuw wachtwoord opnieuw"
    >

    <button onclick="changePassword()">
        Wachtwoord wijzigen
    </button>

    <div id="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "JOUW_SUPABASE_URL";
const SUPABASE_ANON_KEY = "JOUW_SUPABASE_ANON_KEY";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


async function changePassword() {

    const password =
        document.getElementById("password").value;

    const password2 =
        document.getElementById("password2").value;

    const message =
        document.getElementById("message");


    if (!password || !password2) {

        message.className = "error";
        message.textContent =
            "Vul beide velden in.";

        return;
    }


    if (password !== password2) {

        message.className = "error";
        message.textContent =
            "De wachtwoorden komen niet overeen.";

        return;
    }


    if (password.length < 6) {

        message.className = "error";
        message.textContent =
            "Het wachtwoord moet minimaal 6 tekens bevatten.";

        return;
    }


    message.textContent = "Wachtwoord wijzigen...";


    const { error } =
        await supabaseClient.auth.updateUser({
            password: password
        });


    if (error) {

        message.className = "error";
        message.textContent =
            "Wachtwoord wijzigen mislukt: " +
            error.message;

        return;
    }


    message.className = "success";

    message.textContent =
        "Je wachtwoord is succesvol gewijzigd!";


    document.getElementById("password").value = "";
    document.getElementById("password2").value = "";
}

</script>

</body>
</html>
